<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TITLE SCREEN -->
    <div id="title-screen" class="screen">
        <h1>MY RPG</h1>

        <div class="title-buttons">
            <button id="new-game-btn">New Game</button>
            <button id="load-game-btn">Load Game</button>
        </div>

        <p id="title-message"></p>
    </div>


    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen hidden">

        <header>
            <h1>My RPG</h1>

            <button id="menu-btn">Menu</button>
        </header>

        <main>

            <section id="game-world">
                <h2 id="location-name">Village</h2>

                <div id="map">
                    <div id="player">@</div>
                </div>

                <p>Use the arrow keys to move.</p>
            </section>


            <aside id="stats">
                <h2>Character</h2>

                <p>
                    <strong>Name:</strong>
                    <span id="player-name"></span>
                </p>

                <p>
                    <strong>Level:</strong>
                    <span id="player-level"></span>
                </p>

                <p>
                    <strong>HP:</strong>
                    <span id="player-hp"></span> /
                    <span id="player-max-hp"></span>
                </p>

                <p>
                    <strong>MP:</strong>
                    <span id="player-mp"></span> /
                    <span id="player-max-mp"></span>
                </p>

                <p>
                    <strong>Gold:</strong>
                    <span id="player-gold"></span>
                </p>
            </aside>

        </main>
    </div>


    <!-- GAME MENU -->
    <div id="game-menu" class="modal hidden">

        <div class="menu-box">

            <h2>Menu</h2>

            <button id="save-btn">Save Game</button>
            <button id="close-menu-btn">Return to Game</button>
            <button id="title-btn">Quit to Title</button>

            <p id="menu-message"></p>

        </div>

    </div>


    <script src="engine.js"></script>
</body>
</html>
